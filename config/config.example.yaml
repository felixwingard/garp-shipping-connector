# GARP Shipping Connector — Konfiguration
# Kopiera till config.yaml och fyll i era uppgifter.

# skip_email: true   # Sätt för att hoppa över kundmail (t.ex. vid test)
# Mappar
paths:
  watch_dir: "C:\\GARP\\Unifaun\\Outgoing"    # GARP droppar XML här (.xml eller .txt)
  done_dir: "C:\\GARP\\Unifaun\\Done"          # Klara filer flyttas hit
  error_dir: "C:\\GARP\\Unifaun\\Error"        # Felfiler hamnar här
  log_dir: "C:\\GARP\\Logs"                    # Loggfiler
  label_cache_dir: "C:\\GARP\\Labels"          # Etiketter sparas här vid utskriftsfel (skriv ut manuellt)
  bulk_exports_dir: "C:\\GARP\\BulkExports"    # Bring bulk Excel-backuper (vid Avsluta bulk)
  # GARP-följesedel: PDF med samma namn som ordernummer i watch_dir bifogas i kundmail.
  # T.ex. 107739-132888.pdf vid XML med orderno 107739-132888.

# Avsändarinformation (Ernst P AB)
# Avsändaren används alltid från config — XML:s "from" ignoreras.
sender:
  name: "Ernst P AB"
  address1: "Möbelgatan 5"
  zipcode: "43133"
  city: "Mölndal"
  country: "SE"
  phone: "+46317030770"
  email: "${SENDER_EMAIL}"              # Er avsändar-e-post
  customer_number_dhl: "ERT_KUNDNUMMER"  # För domestic_countries
  customer_number_dhl_international: "ERT_UTRIKES_NR"   # För övriga länder
  # Länder som använder inrikes-nr (t.ex. SE, DK, NO, FI). Övriga → utrikes-nr.
  customer_number_dhl_domestic_countries: ["SE", "DK", "NO", "FI"]
  customer_number_bring: ""             # Bring-kundnummer (alternativ till bring.customer_number)

# DHL Paket Sverige API
# Alla API:er (TransportInstruction, Print, ServicePoint, etc.) nås via samma bas-URL.
# Varje API har sin egen sökväg, t.ex. /transportinstructionapi/v1/...
dhl:
  # Sandbox: https://test-api.freight-logistics.dhl.com
  # Produktion: https://api.freight-logistics.dhl.com
  base_url: "https://api.freight-logistics.dhl.com"
  api_key: "ER_PRODUKTIONSNYCKEL"      # Er DHL client-key (GUID) från DHL
  eid_username: "${DHL_EID_USERNAME}"  # För PriceQuote avtalspris — begär från DHL
  eid_password: "${DHL_EID_PASSWORD}"
  # fetch_price_after_shipment: true   # Hämta uppskattat pris efter varje DHL-sändning (avtalspris)
  timeout_seconds: 30
  retry_attempts: 3
  retry_delay_seconds: 5

# Bring (Norge) — Pickup Parcel Bulk + Business Parcel Bulk
# srvid i GARP: BRING:0342, BRING:0332 eller BRING:PICKUP_PARCEL_BULK, BRING:BUSINESS_PARCEL_BULK
# bring:
#   api_uid: "${BRING_API_UID}"
#   api_key: "${BRING_API_KEY}"
#   customer_number: "XXXXXX"
#   consolidated_shipment_id: ""         # Bulk-ID från Mybring (när pall skapats). Uppdatera per batch.
#   use_volume_for_lq: true              # volume > 0 = LQ för 0332/0342 (default). Sätt false för att stänga av.
#   fetch_price_after_shipment: true     # Hämta pris (exkl. moms) efter bokning. Sätt false för att stänga av.
#   social_control: true                 # Tilläggstjänst 1082 vid Pickup Parcel (0340/0342) — rekommenderas vid test
#   test_mode: true
#   timeout_seconds: 30

# Skrivare
# Etikettskrivare = Zebra (fraktetiketter)
# Dokumentskrivare = A4/laser (fraktlistor, följesedlar)
# DHL returnerar alltid PDF-etiketter.
# Välj skrivare via Inställningar i tray-appen, eller ange här.
printers:
  label_printer_name: "ZDesigner ZD420-203dpi ZPL"  # Ert Zebra-skrivarnamn
  label_format: "pdf"                                # pdf eller zpl
  document_printer_name: ""                          # A4-skrivare för CMR/fraktlista
  document_format: "pdf"
  # Endast dessa produktkoder skriver ut dokument (CMR för pall). Tom lista = aldrig skriv ut.
  # Exempel: [202, 210, 205] = Euroconnect, Pall, Euroline. Paket (102,103,109) = bara mailet.
  print_document_for_products: [202, 210, 205]
  # ADR-godsdeklaration skrivs ut för farligt gods (DHL 210/211/202/205). Sätt false för att stänga av.
  print_dg_declaration: true
  # SumatraPDF — sätt om auto-hitta misslyckas. Filen kan heta SumatraPDF.exe eller SumatraPDF-3.5.2-64.exe:
  # sumatra_exe: "C:\\GARP-Shipping\\garp-shipping-connector-main\\SumatraPDF-3.5.2-64.exe"

# SMTP (Loopia) — för kundmail med spårningslänk
# Skapa adressen no-reply@ernstp.se i Loopia (eller använd befintlig).
smtp:
  host: "mailcluster.loopia.se"
  port: 587
  username: "${SMTP_USERNAME}"         # Sätt som miljövariabel
  password: "${SMTP_PASSWORD}"         # Sätt som miljövariabel
  use_tls: true
  from_address: "${SMTP_FROM_ADDRESS}"  # Rekommenderat: no-reply@ernstp.se (automatmail)
  from_name: "Ernst P AB"
  # Länk till Google-omdöme (visas i mailet om satt)
  google_review_url: "https://www.google.com/maps/place//data=!4m3!3m2!1s0x464ff3ba65497121:0x4df5d9552fab788a!12e1?source=g.page.m._&laa=merchant-review-solicitation"
  company_contact_email: "info@ernstp.se"
  company_contact_phone: "031-703 07 70"

# Mappbevakning
watcher:
  poll_interval_seconds: 5
  file_stability_seconds: 2   # Vänta tills filen slutat växa

# Loggning
logging:
  level: "INFO"
  max_file_size_mb: 10
  backup_count: 30
  console_output: true

# =============================================================
# DHL produktkoder (srvid-format i GARP: DHL:PRODUKTKOD[:TILLÄGG])
#
# GARP/Unifaun: Ersätt gamla tjänstekoder med vårt format:
#   Unifaun   →  Ange i GARP
#   ---------    --------------
#   AEX       →  DHL:102   (Paket B2B, hemleverans)
#   ASPO      →  DHL:103   (ServicePoint, ombud)
#
# Produkt  | Namn                    | Notering
# ---------|-------------------------|----------------------------------
# 102      | DHL Paket (B2B)         | Företagspaket
# 103      | DHL ServicePoint (B2C)  | Ombudspaket (kräver ombud-ID)
# 104      | DHL ServicePoint (C2B)  | Returpaket — stöds ej
# 109      | DHL Parcel Connect      | Utrikespaket
# 112      | DHL Parcel Connect Plus | Utrikespaket (Plus)
# 210      | DHL Pall                | Pallfrakt (packageType: 701/702)
# 211      | DHL Stycke              | Styckegods
#
# Tillägg:  DHL:102:AVIS = DHL Paket med avisering (notification)
# =============================================================
#
# =============================================================
# Bring produktkoder (Norge) — srvid: BRING:PRODUKTKOD
#
# Produkt  | Namn                 | Notering
# ---------|----------------------|-----------------------------
# 0340     | Pickup Parcel        | Ombudspaket (B2C), enskilda paket
# 0342     | Pickup Parcel Bulk   | Pall till Oslo — kräver bulk-ID från Mybring
# 0330     | Business Parcel      | Företagspaket, enskilda paket
# 0332     | Business Parcel Bulk | Pall till Oslo — kräver bulk-ID från Mybring
#
# För 0342/0332: Skapa pall i Mybring, kopiera bulk-ID, sätt i config
# eller i srvid: BRING:0342:CS059102945NO (addon = bulk-ID)
#
# Begränsad mängd (LQ): BRING:0332:LQ eller BRING:0332:CS123:LQ (bulk+LQ)
# API: https://developer.bring.com/api/booking/
# =============================================================
